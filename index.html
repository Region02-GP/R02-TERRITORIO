<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Aplicaciones</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      /* REEMPLAZA 'fondo.jpg' POR EL ENLACE O NOMBRE DE TU IMAGEN DE FONDO */
      background-image: linear-gradient(rgba(30, 10, 16, 0.72), rgba(30, 10, 16, 0.82)), url('fondo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #2c0b14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .tarjeta-principal {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      border-top: 5px solid #691C32;
    }

    .banner-contenedor {
      width: 100%;
      height: 130px;
      background-color: #691C32;
      position: relative;
    }

    .banner-imagen {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo-contenedor {
      margin-top: -42px;
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .logo-circular {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      background-color: #691C32;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .contenido {
      padding: 16px 26px 32px;
      text-align: center;
    }

    h1 {
      font-size: 1.55rem;
      color: #4A1021;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitulo-portal {
      color: #5a5a66;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .lista-links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .boton-app {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #691C32 0%, #8A2441 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(105, 28, 50, 0.25);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .boton-app:hover {
      background: linear-gradient(135deg, #521325 0%, #731B34 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(105, 28, 50, 0.4);
    }

    .boton-app:active {
      transform: translateY(0);
    }

    .boton-movil {
      background: linear-gradient(135deg, #3b0d1b 0%, #691C32 100%);
      border: 1px solid #a83253;
    }

    /* ESTILOS PARA EL TEXTO Y DESCRIPCIÓN DENTRO DEL BOTÓN */
    .info-boton {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 12px;
    }

    .titulo-boton {
      font-weight: 700;
      font-size: 1.02rem;
      letter-spacing: 0.2px;
    }

    .desc-boton {
      font-size: 0.8rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.3;
    }

    .separador {
      height: 1px;
      background-color: #e5e7eb;
      margin: 4px 0;
    }

    .flecha {
      font-size: 1.25rem;
      opacity: 0.85;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .boton-app:hover .flecha {
      transform: translateX(4px);
    }

    .pie-pagina {
      margin-top: 24px;
      font-size: 0.78rem;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="tarjeta-principal">
    <!-- BANNER SUPERIOR -->
    <div class="banner-contenedor">
      <img src="https://i.postimg.cc/269Fp7Df/Cartel-oficial-Servidores-de-la-Nacion.png" alt="Banner Institucional" class="banner-imagen">
    </div>

    <!-- LOGOTIPO CIRCULAR (SE OCULTA AUTOMÁTICAMENTE SI NO EXISTE logo.png) -->
    <div class="logo-contenedor">
      <img src="logo.png" alt="Logotipo" class="logo-circular" onerror="this.parentElement.style.display='none'">
    </div>

    <div class="contenido">
      <h1>Portal de Aplicaciones</h1>
      <p class="subtitulo-portal">Selecciona la plataforma a la que deseas acceder</p>

      <div class="lista-links">
        <!-- BOTÓN PUENTE HACIA APPSN (APK) -->
        <button type="button" onclick="abrirAppNativa()" class="boton-app boton-movil">
          <div class="info-boton">
            <span class="titulo-boton">Abrir AppSN</span>
            <span class="desc-boton">Aplicación móvil interna instalada en el dispositivo</span>
          </div>
          <span class="flecha">📱</span>
        </button>

        <div class="separador"></div>

        <!-- ENLACES WEB -->
        <a href="https://eamm831221-beep.github.io/VCXC/" class="boton-app" target="_blank">
          <div class="info-boton">
            <span class="titulo-boton">VCXC</span>
            <span class="desc-boton">Consulta y seguimiento de visitas en campo</span>
          </div>
          <span class="flecha">→</span>
        </a>
        
        <a href="https://region02-gp.github.io/R02-ACTUALIZACION-DE-DATOS/" class="boton-app" target="_blank">
          <div class="info-boton">
            <span class="titulo-boton">Derechohabientes</span>
            <span class="desc-boton">Búsqueda y actualización de registros del padrón</span>
          </div>
          <span class="flecha">→</span>
        </a>
        
        <a href="https://region02-gp.github.io/R02-SERVIDORES/" class="boton-app" target="_blank">
          <div class="info-boton">
            <span class="titulo-boton">Aplicación 3</span>
            <span class="desc-boton">Descripción breve de la tercera plataforma</span>
          </div>
          <span class="flecha">→</span>
        </a>
      </div>

      <div class="pie-pagina">
        Acceso Directo • Sistemas Institucionales
      </div>
    </div>
  </div>

  <!-- SCRIPT PUENTE PARA COMUNICARSE CON EL APK -->
  <script>
    function abrirAppNativa() {
      if (window.AppInventor) {
        window.AppInventor.setWebViewString("abrir_appsn");
      } else {
        alert("Esta función abrirá AppSN automáticamente cuando uses la aplicación instalada en tu teléfono.");
      }
    }
  </script>

</body>
</html>
