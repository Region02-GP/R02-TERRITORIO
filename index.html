<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Aplicaciones</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      /* AQUÍ VA TU IMAGEN DE FONDO */
      background-image: linear-gradient(rgba(30, 10, 16, 0.72), rgba(30, 10, 16, 0.82)), url('fondo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #2c0b14; /* Color de respaldo si no carga la imagen */
      
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .tarjeta-principal {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 440px;
      overflow: hidden; /* Para que el banner respete los bordes redondeados */
      border-top: 5px solid #691C32; /* Detalle guinda superior */
    }

    /* ESTILOS DEL BANNER */
    .banner-contenedor {
      width: 100%;
      height: 130px;
      background-color: #691C32; /* Color de respaldo */
      position: relative;
    }

    .banner-imagen {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* CONTENIDO INTERNO */
    .contenido {
      padding: 28px 26px 32px;
      text-align: center;
    }

    h1 {
      font-size: 1.55rem;
      color: #4A1021;
      font-weight: 700;
      margin-bottom: 6px;
    }

    p {
      color: #5a5a66;
      font-size: 0.95rem;
      margin-bottom: 26px;
    }

    .lista-links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .boton-app {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #691C32 0%, #8A2441 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 10px rgba(105, 28, 50, 0.25);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .boton-app:hover {
      background: linear-gradient(135deg, #521325 0%, #731B34 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(105, 28, 50, 0.4);
    }

    .boton-app:active {
      transform: translateY(0);
    }

    .flecha {
      font-size: 1.2rem;
      opacity: 0.85;
      transition: transform 0.2s ease;
    }

    .boton-app:hover .flecha {
      transform: translateX(4px);
    }

    .pie-pagina {
      margin-top: 24px;
      font-size: 0.78rem;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="tarjeta-principal">
    <!-- BANNER SUPERIOR -->
    <div class="banner-contenedor">
      <!-- Cambia 'banner.jpg' por el nombre exacto de tu archivo -->
      <img src="https://i.postimg.cc/WbrgKM9n/Fondo-crema-con-motivos-mesoamericanos-sutiles.png" alt="Banner Institucional" class="banner-imagen">
    </div>

    <div class="contenido">
      <h1>Portal de Aplicaciones</h1>
      <p>Selecciona la plataforma a la que deseas acceder</p>
 <div class="separador"></div>

        <!-- BOTÓN PARA ABRIR APPSN EN ANDROID -->
        <a href="intent://#Intent;component=com.example.appsn/com.example.appsn.MainActivity;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end;" class="boton-app boton-movil">
  <span>Abrir AppSN (Móvil)</span>
  <span class="flecha">📱</span>
</a>

      </div>


      
      <div class="lista-links">
        <a href="https://eamm831221-beep.github.io/VCXC/" class="boton-app" target="_blank">
          <span>VCXC</span>
          <span class="flecha">→</span>
        </a>
        
        <a href="https://region02-gp.github.io/R02-ACTUALIZACION-DE-DATOS/" class="boton-app" target="_blank">
          <span>Derechohabientes</span>
          <span class="flecha">→</span>
        </a>
        
        <a href="https://tu-url-3.com" class="boton-app" target="_blank">
          <span>Aplicación 3</span>
          <span class="flecha">→</span>
        </a>
      </div>

      <div class="pie-pagina">
        Acceso Directo • Sistemas Web
      </div>
    </div>
  </div>

</body>
</html>
